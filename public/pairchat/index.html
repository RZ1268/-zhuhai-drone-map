<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="referrer" content="no-referrer" />
  <title>PairChat</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0f14;--card:#121821;--card2:#0f141c;--line:#222c39;--text:#f6f7f9;--muted:#98a4b3;--accent:#4d8dff;--good:#42d392;--danger:#ff6b6b}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",system-ui,sans-serif;height:100%}
    body{min-height:100dvh;display:flex;justify-content:center}
    .app{width:min(760px,100%);min-height:100dvh;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px}.brand{font-size:20px;font-weight:750;letter-spacing:-.3px}.badge{font-size:12px;color:var(--good);background:rgba(66,211,146,.1);border:1px solid rgba(66,211,146,.24);padding:7px 9px;border-radius:999px}
    .home{margin:auto 0}.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
    h1{font-size:29px;line-height:1.16;margin:0 0 10px;letter-spacing:-.6px}.sub{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 22px}.status{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:14px;margin:16px 2px 0}.dot{width:8px;height:8px;border-radius:50%;background:#586273}.dot.on{background:var(--good);box-shadow:0 0 0 5px rgba(66,211,146,.08)}
    button{border:0;border-radius:16px;padding:15px 17px;font:inherit;font-weight:700;cursor:pointer}.primary{width:100%;background:var(--accent);color:white}.secondary{width:100%;margin-top:10px;background:#192231;color:#e8edf6;border:1px solid #263244}.ghost{background:transparent;color:var(--muted);padding:8px 10px}.invite{margin-top:15px;padding:13px;background:#0b1119;border:1px solid var(--line);border-radius:16px;display:none}.invite.show{display:block}.invite small{display:block;color:var(--muted);margin-bottom:7px}.invite code{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#d7e3f7}
    .chat{display:none;flex:1;min-height:0}.chat.show{display:flex;flex-direction:column}.chatHead{display:flex;align-items:center;justify-content:space-between;padding:2px 0 12px;border-bottom:1px solid var(--line)}.peerState{display:flex;align-items:center;gap:8px}.peerState b{font-size:16px}.peerState span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.messages{flex:1;overflow-y:auto;padding:16px 2px 10px;display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth}.bubble{max-width:82%;padding:11px 13px;border-radius:18px;line-height:1.45;font-size:16px;word-break:break-word}.me{align-self:flex-end;background:var(--accent);color:white;border-bottom-right-radius:6px}.them{align-self:flex-start;background:#18212d;border:1px solid #233043;border-bottom-left-radius:6px}.sys{align-self:center;color:var(--muted);font-size:12px;padding:7px 10px;background:#101720;border:1px solid var(--line);border-radius:999px}.composer{display:flex;gap:9px;padding-top:10px;border-top:1px solid var(--line)}.composer input{flex:1;background:#121923;border:1px solid #243044;color:var(--text);border-radius:16px;padding:14px 15px;font:inherit;outline:none}.composer input:focus{border-color:#3f6fb3}.send{background:var(--accent);color:white;padding:0 18px}.foot{color:#667384;font-size:11px;text-align:center;margin-top:12px;line-height:1.45}.err{color:#ffb0b0}
    @media (max-width:520px){.app{padding-left:12px;padding-right:12px}.card{padding:20px 17px;border-radius:22px}h1{font-size:27px}.bubble{max-width:88%}}
  </style>
</head>
<body>
  <main class="app">
    <div class="top"><div class="brand">PairChat</div><div class="badge">端对端加密</div></div>

    <section id="home" class="home">
      <div class="card">
        <h1 id="title">点一下，发链接，直接聊。</h1>
        <p id="subtitle" class="sub">不再复制什么邀请口令、回应口令。创建邀请后直接用 iPhone 分享，对方点开链接就自动连接。</p>
        <button id="createBtn" class="primary">创建邀请并分享</button>
        <button id="shareBtn" class="secondary" style="display:none">再次分享邀请链接</button>
        <div id="inviteBox" class="invite"><small>邀请链接</small><code id="inviteLink"></code></div>
        <div class="status"><i id="statusDot" class="dot"></i><span id="statusText">正在连接信令服务…</span></div>
      </div>
      <div class="foot">消息正文使用 AES-256-GCM 加密，密钥只放在邀请链接的 # 后面；网页服务器和 PeerJS 信令服务拿不到这段密钥。聊天内容通过 WebRTC 点对点传输。</div>
    </section>

    <section id="chat" class="chat">
      <div class="chatHead">
        <div class="peerState"><i class="dot on"></i><div><b>已建立加密连接</b><span>AES-256-GCM · WebRTC</span></div></div>
        <button id="closeBtn" class="ghost">断开</button>
      </div>
      <div id="messages" class="messages"></div>
      <form id="form" class="composer">
        <input id="input" autocomplete="off" enterkeyhint="send" placeholder="发消息…" maxlength="4000" />
        <button class="send" type="submit">发送</button>
      </form>
    </section>
  </main>

  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const state = { peer:null, conn:null, key:null, inviteUrl:null, isHost:false };

    const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const unb64u = s => {
      s = s.replace(/-/g,'+').replace(/_/g,'/');
      while (s.length % 4) s += '=';
      const raw = atob(s); const out = new Uint8Array(raw.length);
      for (let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i); return out;
    };
    const rand = n => { const a=new Uint8Array(n); crypto.getRandomValues(a); return a; };
    const randId = n => b64u(rand(n)).replace(/[^a-zA-Z0-9]/g,'').slice(0,n*2);
    const getPeerId = () => {
      let id = localStorage.getItem('pc_peer_id');
      if (!id) { id = 'pc-' + randId(14); localStorage.setItem('pc_peer_id', id); }
      return id;
    };
    const loadInvites = () => { try{return JSON.parse(localStorage.getItem('pc_invites')||'{}')}catch{return{}} };
    const saveInvites = x => localStorage.setItem('pc_invites', JSON.stringify(x));
    const setStatus = (text,on=false,err=false) => { $('statusText').textContent=text; $('statusText').className=err?'err':''; $('statusDot').className='dot'+(on?' on':''); };

    async function importKey(raw){ return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']); }
    async function seal(obj){
      const iv=rand(12); const plain=enc.encode(JSON.stringify(obj));
      const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},state.key,plain);
      return {v:1,iv:b64u(iv),c:b64u(new Uint8Array(ct))};
    }
    async function openBox(box){
      if(!box || box.v!==1) throw new Error('bad box');
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u(box.iv)},state.key,unb64u(box.c));
      return JSON.parse(dec.decode(pt));
    }

    function addMessage(text,who){
      const d=document.createElement('div'); d.className='bubble '+who; d.textContent=text; $('messages').appendChild(d); $('messages').scrollTop=$('messages').scrollHeight;
    }
    function addSystem(text){ const d=document.createElement('div'); d.className='sys'; d.textContent=text; $('messages').appendChild(d); }
    function showChat(){ $('home').style.display='none'; $('chat').classList.add('show'); setTimeout(()=>$('input').focus(),150); }
    function resetHome(msg='连接已断开'){
      try{state.conn&&state.conn.close()}catch{} state.conn=null; state.key=null;
      $('chat').classList.remove('show'); $('home').style.display='block'; $('messages').innerHTML=''; setStatus(msg,true,false);
    }

    async function bindConnection(conn, rawKey, hostSide){
      if(state.conn && state.conn.open) { try{conn.close()}catch{} return; }
      state.conn=conn; state.isHost=hostSide; state.key=await importKey(rawKey);
      conn.on('open',()=>{ showChat(); addSystem('已建立端对端加密连接'); });
      conn.on('data', async data => { try{ const msg=await openBox(data); if(msg.t==='m' && typeof msg.text==='string') addMessage(msg.text,'them'); }catch(e){ addSystem('收到一条无法解密的消息'); } });
      conn.on('close',()=>resetHome('对方已断开'));
      conn.on('error',()=>resetHome('连接出现错误'));
    }

    async function createInvite(){
      if(!state.peer || state.peer.disconnected){ setStatus('信令服务还没准备好，等一秒再点',false,true); return; }
      const inviteId=randId(9); const rawKey=rand(32); const invites=loadInvites(); invites[inviteId]=b64u(rawKey); saveInvites(invites);
      const base=location.origin + location.pathname;
      const url=base+'?to='+encodeURIComponent(state.peer.id)+'&i='+encodeURIComponent(inviteId)+'#k='+b64u(rawKey);
      state.inviteUrl=url; $('inviteLink').textContent=url; $('inviteBox').classList.add('show'); $('shareBtn').style.display='block';
      setStatus('邀请已创建，等对方点开',true,false);
      await shareInvite();
    }
    async function shareInvite(){
      if(!state.inviteUrl) return;
      try{
        if(navigator.share){ await navigator.share({title:'PairChat 邀请',text:'点开就能和我端对端加密聊天：',url:state.inviteUrl}); }
        else { await navigator.clipboard.writeText(state.inviteUrl); setStatus('链接已复制，直接发给对方',true,false); }
      }catch(e){ if(e && e.name!=='AbortError') { try{await navigator.clipboard.writeText(state.inviteUrl); setStatus('链接已复制，直接发给对方',true,false);}catch{} } }
    }

    async function connectFromInvite(){
      const qs=new URLSearchParams(location.search); const hs=new URLSearchParams(location.hash.slice(1));
      const to=qs.get('to'), inviteId=qs.get('i'), keyText=hs.get('k');
      if(!to || !inviteId || !keyText) return false;
      $('title').textContent='正在建立加密连接…'; $('subtitle').textContent='不用输入任何东西，保持这个页面打开就行。'; $('createBtn').style.display='none';
      setStatus('正在连接对方…',false,false);
      try{
        const rawKey=unb64u(keyText); if(rawKey.length!==32) throw new Error('bad key');
        const conn=state.peer.connect(to,{reliable:true,metadata:{inviteId}});
        await bindConnection(conn,rawKey,false);
        setTimeout(()=>{ if(!conn.open) setStatus('暂时连不上。让对方保持页面打开，然后刷新一次。',false,true); },9000);
      }catch(e){ setStatus('这个邀请链接无效或已经损坏',false,true); }
      return true;
    }

    function start(){
      if(!window.Peer){ setStatus('PeerJS 加载失败，请检查网络后刷新',false,true); return; }
      const id=getPeerId(); state.peer=new Peer(id,{debug:0});
      state.peer.on('open', async ()=>{
        setStatus('已就绪',true,false);
        await connectFromInvite();
      });
      state.peer.on('connection', async conn=>{
        const inviteId=conn.metadata && conn.metadata.inviteId; const invites=loadInvites(); const keyText=inviteId && invites[inviteId];
        if(!keyText){ conn.on('open',()=>conn.close()); return; }
        try{ await bindConnection(conn,unb64u(keyText),true); }
        catch{ try{conn.close()}catch{} }
      });
      state.peer.on('error', e=>{
        if(e && e.type==='unavailable-id'){
          localStorage.removeItem('pc_peer_id'); setStatus('身份冲突，正在重新生成…',false,true); setTimeout(()=>location.reload(),500);
        } else setStatus('网络连接失败，刷新再试',false,true);
      });
      state.peer.on('disconnected',()=>setStatus('信令服务暂时断开',false,true));
    }

    $('createBtn').addEventListener('click',createInvite);
    $('shareBtn').addEventListener('click',shareInvite);
    $('closeBtn').addEventListener('click',()=>resetHome('已断开连接'));
    $('form').addEventListener('submit', async e=>{
      e.preventDefault(); const text=$('input').value.trim(); if(!text || !state.conn || !state.conn.open || !state.key) return;
      $('input').value=''; addMessage(text,'me');
      try{ state.conn.send(await seal({t:'m',text,ts:Date.now()})); }catch{ addSystem('发送失败'); }
    });
    window.addEventListener('beforeunload',()=>{ try{state.conn&&state.conn.close()}catch{} });

    async function loadPeerJS(){
      if(window.Peer) return true;
      const urls=[
        'https://cdn.bootcdn.net/ajax/libs/peerjs/1.5.5/peerjs.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js',
        'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js'
      ];
      setStatus('正在加载连接组件…',false,false);
      for(const url of urls){
        const ok=await new Promise(resolve=>{
          const sc=document.createElement('script'); let done=false;
          const finish=v=>{if(done)return;done=true;clearTimeout(timer);if(!v)sc.remove();resolve(v)};
          const timer=setTimeout(()=>finish(false),4500);
          sc.src=url; sc.async=true; sc.onload=()=>finish(!!window.Peer); sc.onerror=()=>finish(false);
          document.head.appendChild(sc);
        });
        if(ok) return true;
      }
      return false;
    }

    (async()=>{
      const ok=await loadPeerJS();
      if(!ok){setStatus('连接组件加载失败。换个网络后点刷新。',false,true);return;}
      start();
    })();
  })();
  </script>
</body>
</html>
