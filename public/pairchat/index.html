</style></head><body><div class="app"><div class="top"><div id="dot" class="dot"></div><div class="brand">PairChat</div><div class="grow"></div><button id="addTop" class="round">＋</button></div><div class="main"><section id="chats" class="page on"><div class="h1">聊天</div><div class="sub">点对点连接 · 端到端加密</div><div id="chatList" class="card"></div></section><section id="friends" class="page"><div class="h1">好友</div><div class="sub">双方手机都打开 PairChat，输入好友码即可添加。</div><div class="card"><div class="row"><input id="fc" class="inp" placeholder="好友码"><button id="fa" class="btn">添加</button></div></div><div id="reqs"></div><div class="sec">联系人</div><div id="fl" class="card"></div></section><section id="me" class="page"><div class="h1">我的</div><div class="card"><div class="sub">昵称</div><div class="row" style="margin-top:7px"><input id="nm" class="inp" maxlength="24"><button id="save" class="btn2">保存</button></div><div class="sec">我的好友码</div><div id="code" class="code">连接中…</div><div class="actions"><button id="copy" class="btn2">复制</button><button id="share" class="btn">分享邀请</button></div></div><div class="card"><div class="sub">本机身份安全码</div><div id="fp" class="safe" style="margin-top:8px">生成中…</div><div class="sub" style="margin-top:8px">私钥只保存在这台设备。不要清除本网站 Safari 数据，否则会生成新身份。</div></div></section><section id="chat" class="chat"><div class="ch"><button id="back" class="back">‹</button><div id="cav" class="av" style="width:36px;height:36px">P</div><div><div id="cn" class="ct">好友</div><div id="cst" class="cs">离线</div></div><div class="grow"></div><button id="info" class="round" style="width:34px;height:34px">ⓘ</button></div><div id="typing" class="typing"></div><div id="msgs" class="msgs"></div><div class="composer"><input id="photo" type="file" accept="image/*" hidden><button id="photoB" class="plus">＋</button><textarea id="box" rows="1" class="txt" placeholder="消息"></textarea><button id="send" class="send">↑</button></div></section></div><nav class="nav"><button class="on" data-p=
